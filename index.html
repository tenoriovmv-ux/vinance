<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B7FF3C">
<meta name="color-scheme" content="light only">
<title>Mi Despensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --ink:#111411; --muted:#8E978F; --line:#ECEFEA; --soft:#F3F5F1;
  --lime:#B7FF3C; --lime-2:#E6FFBF; --yellow:#FFE13B; --red:#FF5A5F; --red-soft:#FFE9EA; --amber:#E8A200; --amber-soft:#FFF5CC;
  --shadow:0 2px 6px rgba(17,20,17,.04),0 12px 32px rgba(17,20,17,.06);
  --hero:linear-gradient(180deg,#B7FF3C 0%,#DDFFA6 42%,var(--bg) 100%);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;color-scheme:light;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hero{background:var(--hero);margin:0 -18px;padding:0 18px}
.hero.tall{padding-bottom:140px;margin-bottom:-140px}
.app{max-width:480px;margin:0 auto;padding:0 18px 130px}
header.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:34px;line-height:1.05;margin:0;font-weight:800;font-style:italic;letter-spacing:-.02em}
h1 .br{font-style:normal;font-weight:500;opacity:.55;margin:0 4px}
h1 .sp{font-style:normal;font-size:14px;vertical-align:top;margin-left:-4px}
.sub{color:var(--muted);font-size:14px;margin-top:6px;font-weight:500}
.hero .sub{color:rgba(17,20,17,.6)}
.search{margin-top:16px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;padding:13px 0;width:100%;outline:none;font-weight:500}
.chips{display:flex;gap:4px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none;margin:0 -6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;border-radius:16px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;min-width:56px;line-height:1.15}
.chip .n{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.summary{background:var(--surface);border-radius:26px;padding:20px 20px 16px;box-shadow:var(--shadow);margin-top:8px}
.summary .lbl{color:var(--muted);font-size:15px;font-weight:500}
.summary .big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 14px;display:flex;align-items:baseline;gap:8px}
.summary .big .of{font-size:38px;color:var(--muted);opacity:.45;font-weight:800;white-space:nowrap}
.summary .big .of2{font-size:14px;color:var(--muted);font-weight:600;align-self:center;margin:8px 0 0 6px;letter-spacing:0}
.ring{width:38px;height:38px;border-radius:50%;flex:none;align-self:center;background:conic-gradient(var(--lime) var(--p,0%),var(--soft) 0);position:relative}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.bars div{font-size:14px;font-weight:600}
.bars small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.bars i{display:block;height:6px;border-radius:6px;background:var(--soft);margin-top:8px;overflow:hidden}
.bars i b{display:block;height:100%;background:var(--yellow);border-radius:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill-b{border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg)}
.pill-b.tip{background:var(--soft);color:var(--muted);font-weight:600}
.pill-b .tag{background:var(--lime);color:#111;font-weight:800;font-size:12px;padding:2px 6px;border-radius:5px;font-style:italic;letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:0;text-align:left;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);width:100%}
.emo{width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.item .name{font-weight:700;font-size:17px;line-height:1.2}
.item .meta{font-size:13px;color:var(--muted);margin-top:3px;font-weight:500}
.item .right{text-align:right;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.item .loc{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.st-expired{color:var(--red)!important;font-weight:700}.st-soon{color:var(--amber)!important;font-weight:700}.st-low{color:var(--amber)!important;font-weight:600}
.bar{grid-column:2/-1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:-4px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--lime)}
.expired .bar i{background:var(--red)}.soon .bar i{background:var(--yellow)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-weight:500}
.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:6px;font-weight:800}
.btn{border:0;border-radius:999px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.lime{background:var(--lime);color:#111}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:8px 8px 10px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 24px rgba(17,20,17,.25);transform:translateY(-16px)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--lime);color:#111;font-size:10px;line-height:16px;margin-left:2px;font-weight:800}
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:14px}
.card h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in-f{width:100%;border:1.5px solid transparent;background:var(--soft);border-radius:14px;padding:12px 14px;outline:none;font-weight:500}
.in-f:focus{border-color:var(--ink);background:var(--surface)}
textarea.in-f{resize:vertical;min-height:64px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:6px;font-weight:500}
.hint b{color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:600}
.check input{width:20px;height:20px;accent-color:#111}
.overlay{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:28px 28px 0 0;max-height:75%;overflow-y:auto;overflow-x:hidden;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);margin:0 -20px 8px;padding:10px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;padding-right:44px}
input[type=date],input[type=number]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:48px}
.in-f{max-width:100%}
.sheet h2{margin:4px 0 2px;font-size:26px;font-weight:800;font-style:italic;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;background:var(--soft);border-radius:18px;padding:4px}
.stats div{padding:12px 12px}
.stats small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stats strong{font-size:17px;font-weight:800}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:999px;padding:6px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);font-size:24px;box-shadow:var(--shadow)}
.stepper span{font-weight:800;font-size:20px}
.actions{display:grid;gap:8px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recipe{padding:0;overflow:hidden}
.recipe .hd{padding:18px}
.recipe .why{font-size:14px;color:var(--muted);margin:2px 0 10px}
.pl{display:inline-block;font-size:13px;border-radius:999px;padding:4px 11px;margin:0 6px 6px 0;background:var(--lime-2);color:var(--ink);font-weight:600}
.pl.warn{background:var(--amber-soft)}
.pl.miss{background:var(--soft);color:var(--muted)}
.match{font-size:14px;font-weight:700}
.recipe details{border-top:1px solid var(--line)}
.recipe summary{padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer}
.recipe ol{margin:0;padding:0 18px 16px 36px;font-size:15px}
.recipe ol li{margin-bottom:6px}
.recipe .ft{padding:0 18px 18px}
.shop{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.shop input[type=checkbox]{width:22px;height:22px;accent-color:#111;flex:none}
.shop .t{flex:1;font-weight:600;background:none;border:0;text-align:left;padding:0}
.shop.done .t{text-decoration:line-through;color:var(--muted)}
.mini{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.mini.lime{background:var(--lime);color:#111}
.sec{font-size:14px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.addrow{display:flex;gap:8px;margin-top:16px}
.addrow input{flex:1}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:14px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--lime);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:90%}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .t{flex:1;font-weight:600}
.mrow small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.xclose{position:absolute;right:16px;top:16px;width:34px;height:34px;padding:0;border-radius:50%}
.sheet-head{position:sticky}
.emoji-in{width:64px!important;flex:0 0 64px;text-align:center;font-size:22px;padding:8px}
.emo-prev{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px}
</style>
</head>

const STEP={un:1,g:50,kg:0.1,ml:100,L:0.25,paquete:1};
const IN_CLAUDE=!!window.claude;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
function diff(a,b){return Math.round((pd(a)-pd(b))/864e5)}
function addDays(s,n){return new Date(pd(s)+n*864e5).toISOString().slice(0,10)}
function fmtQty(q){return (Math.round(q*100)/100).toString().replace(".",",")}
function fmtDate(s){const[y,m,d]=s.split("-");return `${+d} ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1]}`}
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL");
function lastPrice(name){const h=state.prices[norm(name)];return h&&h.length?h[h.length-1]:null}
function recordPrice(name,price,qty,unit){const k=norm(name);const h=state.prices[k]=state.prices[k]||[];const l=h[h.length-1];if(l&&l.price===price&&l.date===today())return;h.push({date:today(),price,qty,unit});if(h.length>24)h.shift()}
function monthSpend(off){const d=new Date();d.setMonth(d.getMonth()-off);const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");let t=0;Object.values(state.prices).forEach(h=>h.forEach(p=>{if(p.date.startsWith(ym))t+=p.price}));return t}
function plural(n,w){return n+" "+w+(n===1?"":"s")}

function lookup(name){
  const n=norm(name); if(!n) return null;
  return FK.find(f=>norm(f[0])===n)||FK.filter(f=>n.includes(norm(f[0]))).sort((a,b)=>b[0].length-a[0].length)[0]||FK.find(f=>norm(f[0]).startsWith(n))||null;
}
function estimate(name,locK,opened){
  const f=lookup(name); if(!f) return null;
  const base=locOf(locK).base;
  let d=f[3][base]; if(d==null) return {none:true,f};
  if(opened&&f[4]) d=Math.min(d,f[4]);
  return {days:d,f};
}

/* ---------- estado y guardado ---------- */
const KEY="mi-despensa-v1";
function fresh(){return {items:[],shop:[],prefs:"No como cerdo.",warn:3,recipes:[],cats:DEF_CATS.map(c=>({...c})),locs:DEF_LOCS.map(l=>({...l})),prices:{},_upd:0}}
function normalize(s){
  const b=fresh();const o=Object.assign(b,s||{});
  o.items=Array.isArray(s?.items)?s.items:[];o.shop=Array.isArray(s?.shop)?s.shop:[];o.recipes=Array.isArray(s?.recipes)?s.recipes:[];
  if(!Array.isArray(s?.cats)||!s.cats.length) o.cats=DEF_CATS.map(c=>({...c}));
  if(!Array.isArray(s?.locs)||!s.locs.length) o.locs=DEF_LOCS.map(l=>({...l}));
  if(!s?.prices||typeof s.prices!=="object") o.prices={};
  return o;
}
let state=(()=>{try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return fresh()}})();
let ui={tab:"despensa",filter:"todo",q:"",loading:false,err:""};
let docRef=null,saveT=null,syncState="local",syncErr="",syncWarned=false;
const locOf=k=>state.locs.find(l=>l.k===k)||state.locs[0];
const locName=k=>locOf(k).n;
const locIn=k=>{const l=locOf(k);return DEF_LOCS.some(d=>d.k===k)?BASE_IN[l.base]:"en "+l.n};
const catEmoji=n=>(state.cats.find(c=>c.n===n)||{e:"📦"}).e;

function save(){
  state._upd=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  clearTimeout(saveT); saveT=setTimeout(pushRemote,200);
}
async function pushRemote(){
  if(!docRef) return;
  try{await docRef.set({state:JSON.parse(JSON.stringify(state)),updated:state._upd});syncState="ok";syncErr=""}
  catch(e){syncState="err";syncErr=(e&&(e.code||"")+" "+(e.message||""))||"";if(!syncWarned){syncWarned=true;toast("No se pudo guardar en tu cuenta; revisa Ajustes")}}
  if(ui.tab==="ajustes") render();
}
async function initRemote(){
  try{
    if(!IN_CLAUDE) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    docRef=db.doc("data/users/"+id+"/estado");
    const snap=await docRef.get();
    if(snap.exists){
      const r=snap.data();
      if(r&&r.state&&(r.updated||0)>=(state._upd||0)){state=normalize(r.state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};syncState="ok";render()}
      else pushRemote();
    } else if(state.items.length||state.shop.length) pushRemote();
    else syncState="ok";
  }catch(e){syncState="err";syncErr=(e&&(e.code||"")+" "+(e.message||""))||""}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&saveT){clearTimeout(saveT);pushRemote()}});
window.addEventListener("pagehide",()=>{if(saveT){clearTimeout(saveT);pushRemote()}});

/* ---------- cálculo por producto ---------- */
function expOf(it){return it.exp||(it.estDays!=null?addDays(it.bought,it.estDays):null)}
function info(it){
  const e=expOf(it), t=today();
  const left=e!=null?diff(e,t):null;
  let st="ok";
  if(left!=null&&left<0) st="expired"; else if(left!=null&&left<=state.warn) st="soon";
  const low=it.low>0&&it.qty<=it.low;
  let label="";
  if(left==null) label="Sin fecha";
  else if(left<0) label=`Venció hace ${plural(-left,"día")}`;
  else if(left===0) label="Vence hoy";
  else if(left===1) label="Vence mañana";
  else if(left<=state.warn) label=`Vence en ${left} días`;
  else label=`Quedan ${left} días`;
  let ratio=1; if(e){const tot=Math.max(1,diff(e,it.bought));ratio=Math.max(0,Math.min(1,left/tot))}
  return {exp:e,left,st,low,label,ratio,inHome:Math.max(0,diff(t,it.bought))};
}
function counts(){
  let ex=0,so=0,lo=0; const by={};
  state.locs.forEach(l=>by[l.k]=0);
  state.items.forEach(it=>{const i=info(it);by[it.loc]=(by[it.loc]||0)+1;if(i.st==="expired")ex++;else if(i.st==="soon")so++;if(i.low)lo++});
  return {ex,so,lo,by,alerts:state.items.filter(it=>{const i=info(it);return i.st!=="ok"||i.low}).length};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===ui.tab?"page":"false"));
  const pend=state.shop.filter(s=>!s.done).length;
  $("#shopBadge").innerHTML=pend?` <span class="badge">${pend}</span>`:"";
  $("#app").innerHTML=({despensa:vPantry,recetas:vRecipes,compras:vShop,ajustes:vSettings})[ui.tab]();
  bindView();
}
const H=(t,sub)=>`<header class="top"><h1><span class="br">[</span>${t}<span class="br">]</span><span class="sp">✦</span></h1>${sub?`<div class="sub">${sub}</div>`:""}</header>`;

function vPantry(){
  const c=counts();
  const chips=[["todo","Todo",state.items.length],...state.locs.map(l=>[l.k,l.n,c.by[l.k]||0]),["alertas","Alertas",c.alerts]];
  let items=state.items.slice();
  if(ui.filter==="alertas") items=items.filter(it=>{const i=info(it);return i.st!=="ok"||i.low});
  else if(ui.filter!=="todo") items=items.filter(it=>it.loc===ui.filter);
  if(ui.q) items=items.filter(it=>norm(it.name).includes(norm(ui.q)));
  const rank={expired:0,soon:1,ok:2};
  items.sort((a,b)=>{const A=info(a),B=info(b);return rank[A.st]-rank[B.st]||(A.left??1e9)-(B.left??1e9)||a.name.localeCompare(b.name)});
  const total=state.items.length, okN=total-c.alerts, p=total?Math.round(okN/total*100):0;
  const soonest=state.items.map(it=>({it,i:info(it)})).filter(x=>x.i.st==="soon").sort((a,b)=>a.i.left-b.i.left)[0];
  const tip=c.ex?`Bota o revisa lo vencido`:soonest?`Cocina ${soonest.it.name.toLowerCase()} pronto`:c.lo?`Anota lo que falta en compras`:total?`Todo fresco por ahora`:`Agrega tu primer producto`;
  const pillTxt=c.ex?`${plural(c.ex,"producto")} vencido${c.ex>1?"s":""}`:c.so?`${c.so} por vencer`:c.lo?`${c.lo} con poco stock`:`Todo en orden`;
  const summary=`<section class="summary"><div class="lbl">Productos en casa</div>
    <div class="big"><span class="ring" style="--p:${p}%"></span>${total}<span class="of">/ ${c.alerts}</span><span class="of2">con aviso</span></div>
    <div class="bars">${state.locs.slice(0,3).map(l=>`<div>${l.n}<small>${plural(c.by[l.k]||0,"producto")}</small><i><b style="width:${total?Math.round((c.by[l.k]||0)/total*100):0}%"></b></i></div>`).join("")}</div>
    <div class="pills"><button class="pill-b" data-act="filter" data-v="alertas">${c.ex?"⚠️":c.so||c.lo?"⏰":"🙂"} ${pillTxt}</button><span class="pill-b tip"><span class="tag">TIPS</span>${esc(tip)}</span></div></section>`;
  const list=items.length?items.map(itemRow).join(""):
    (total?`<div class="empty"><strong>Nada por aquí</strong>No hay productos en este filtro.</div>`:
    `<div class="empty"><strong>Tu despensa está vacía</strong>Agrega lo que tienes en el refrigerador, el congelador y los cajones.<br><br><button class="btn primary" data-act="add">Agregar el primer producto</button></div>`);
  return `<div class="hero tall">${H("Mi despensa",plural(total,"producto")+" registrados")}
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar producto" value="${esc(ui.q)}" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="Filtrar">${chips.map(([k,l,n])=>`<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${ui.filter===k}"><span class="n">${n}</span>${esc(l)}</button>`).join("")}</div></div>
    ${ui.filter==="todo"&&!ui.q?summary:""}<div class="list">${list}</div>`;
}
function itemRow(it){
  const i=info(it);
  const sub=i.st!=="ok"?`<span class="st-${i.st}">${i.label}</span>`:(i.low?`<span class="st-low">Queda poco</span>`:i.label);
  return `<button class="item ${i.st}" data-act="open" data-id="${it.id}">
    <span class="emo" aria-hidden="true">${it.emoji||catEmoji(it.cat)}</span>
    <span><div class="name">${esc(it.name)}${it.opened?` <span style="font-weight:500;color:var(--muted);font-size:13px">abierto</span>`:""}</div><div class="meta">${sub}</div></span>
    <span class="right">${fmtQty(it.qty)} ${esc(it.unit)}<div class="loc">${esc(locName(it.loc))}</div></span>
    ${i.exp?`<span class="bar"><i style="width:${Math.round(i.ratio*100)}%"></i></span>`:""}
  </button>`;
}

function vRecipes(){
  const n=state.items.filter(it=>info(it).st!=="expired").length;
  const soon=state.items.filter(it=>info(it).st==="soon").map(it=>it.name);
  let body="";
  if(ui.loading) body=`<div class="thinking"><span class="spin"></span>Buscando recetas con lo que tienes…</div>`;
  else if(ui.err) body=`<div class="card"><h3>No se pudieron sugerir recetas</h3><p class="hint">${esc(ui.err)}</p></div>`;
  if(!ui.loading&&state.recipes.length) body+=state.recipes.map(recipeCard).join("");
  else if(!ui.loading&&!ui.err) body+=`<div class="empty"><strong>¿No sabes qué cocinar?</strong>${IN_CLAUDE?"Te sugiero recetas con lo que ya tienes, empezando por lo que vence antes.":"Armo un mensaje con lo que tienes para que se lo pidas a Claude y te sugiera recetas."}</div>`;
  const btn=IN_CLAUDE?`<button class="btn primary block" style="margin-top:12px" data-act="suggest" ${n&&!ui.loading?"":"disabled"}>${state.recipes.length?"✨ Sugerir otras recetas":"✨ Sugerir recetas"}</button>`
    :`<button class="btn primary block" style="margin-top:12px" data-act="copyPrompt" ${n?"":"disabled"}>✨ Pedir recetas a Claude</button>`;
  return `<div class="hero">${H("Qué cocino",n?plural(n,"ingrediente")+" disponibles"+(soon.length?`. Por vencer: ${esc(soon.slice(0,4).join(", "))}`:""):"Agrega productos para recibir recetas")}</div>
    <div class="card"><label class="f" for="prefs" style="margin-top:0">Mis preferencias</label>
    <textarea id="prefs" class="in-f" placeholder="Ej: no como cerdo, algo rápido, para 2 personas">${esc(state.prefs)}</textarea>${btn}</div>${body}`;
}
function recipeCard(r,idx){
  const soonSet=new Set(state.items.filter(it=>info(it).st==="soon").map(it=>norm(it.name)));
  const isSoon=u=>[...soonSet].some(s=>norm(u).includes(s)||s.includes(norm(u)));
  const uses=r.usa||[], miss=r.faltan||[];
  return `<div class="card recipe"><div class="hd">
    <h3>${esc(r.titulo)}</h3><div class="why">${esc(r.por_que||"")}</div>
    <div class="match">Tienes ${uses.length} de ${uses.length+miss.length} ingredientes${r.minutos?`, ${r.minutos} min`:""}</div>
    <div style="margin-top:10px">${uses.map(u=>`<span class="pl ${isSoon(u)?"warn":""}">${esc(u)}</span>`).join("")}${miss.map(m=>`<span class="pl miss">Falta: ${esc(m)}</span>`).join("")}</div>
  </div>
  <details><summary>Ver preparación</summary><ol>${(r.pasos||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ol></details>
  ${miss.length?`<div class="ft"><button class="btn ghost block" data-act="missing" data-i="${idx}">Agregar lo que falta a compras</button></div>`:""}</div>`;
}

function vShop(){
  const inList=new Set(state.shop.map(s=>norm(s.name)));
  const sugg=state.items.filter(it=>{const i=info(it);return (i.low||i.st==="expired")&&!inList.has(norm(it.name))});
  const pend=state.shop.filter(s=>!s.done), done=state.shop.filter(s=>s.done);

  return `<div class="hero">${H("Compras",pend.length?plural(pend.length,"producto")+" por comprar":"Tu lista está al día")}</div>
    <div class="addrow"><input id="shopIn" class="in-f" placeholder="Agregar a la lista" autocomplete="off"><button class="btn primary" data-act="addShop">Agregar</button></div>
    ${(()=>{const a=monthSpend(0),p=monthSpend(1);if(!a&&!p)return"";const d=p?Math.round((a-p)/p*100):null;return`<div class="card" style="padding:14px 18px"><div style="color:var(--muted);font-size:14px">Gastado en productos registrados</div><div style="font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px">${clp(a)} <span style="font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0">este mes</span></div><div style="font-size:14px;color:var(--muted);font-weight:600;margin-top:2px">Mes pasado ${clp(p)}${d!=null&&d!==0?`, <b class="${d>0?"st-expired":""}" style="${d<0?"color:var(--amber)":""}">${d>0?"+":""}${d}%</b>`:""}</div></div>`})()}
    ${sugg.length?`<div class="sec">Sugeridos por tu despensa</div><div class="list" style="margin-top:0">${sugg.map(it=>`<div class="shop"><span class="emo" style="width:36px;height:36px;font-size:18px;border-radius:10px">${it.emoji||catEmoji(it.cat)}</span><span class="t">${esc(it.name)}<div style="font-size:12px;color:var(--muted);font-weight:500">${info(it).st==="expired"?"Vencido":"Queda poco"}</div></span><button class="mini" data-act="suggShop" data-id="${it.id}">Agregar</button></div>`).join("")}</div>`:""}
    ${pend.length?`<div class="sec">Por comprar</div><div class="list" style="margin-top:0">${pend.map(row).join("")}</div>`:""}
    ${done.length?`<div class="sec">Comprados</div><div class="list" style="margin-top:0">${done.map(row).join("")}</div><button class="btn ghost block" style="margin-top:12px" data-act="clearDone">Borrar comprados</button>`:""}
    ${!pend.length&&!done.length&&!sugg.length?`<div class="empty"><strong>Lista vacía</strong>Cuando algo se acabe o quede poco, aparecerá aquí como sugerencia.</div>`:""}`;
}

/* ---------- sheet ---------- */
function openSheet(html,after){
  closeSheet();
  const o=document.createElement("div");o.className="overlay";o.id="ov";
  const m=html.match(/<h2>[\s\S]*?<\/h2>/);const title=m?m[0]:"";if(m)html=html.replace(m[0],"");
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><div class="grab"></div>${title}<button class="mini xclose" data-close aria-label="Cerrar">✕</button></div>${html}</div>`;
  o.querySelector("[data-close]").onclick=closeSheet;
  o.addEventListener("click",e=>{if(e.target===o)closeSheet()});
  document.body.appendChild(o);document.body.style.overflow="hidden";
  after&&after(o);
}
function closeSheet(){const o=$("#ov");if(o)o.remove();document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function formSheet(it,prefill){
  const edit=!!it;
  const d=it||Object.assign({name:"",emoji:"",qty:1,unit:"un",loc:state.locs[0].k,cat:"Otros",bought:today(),exp:"",opened:false,low:0},prefill||{});
  openSheet(`<h2>${edit?"Editar producto":"Agregar producto"}</h2>
    <label class="f" for="fName">Producto</label>
    <div class="row"><span class="emo-prev" id="fEmoji" aria-hidden="true">${esc(d.emoji||catEmoji(d.cat))}</span><input id="fName" class="in-f" list="fkList" value="${esc(d.name)}" placeholder="Ej: yogur, pollo, arroz" autocomplete="off"></div>
    <datalist id="fkList">${FK.map(f=>`<option value="${esc(f[0])}">`).join("")}</datalist>
    <div class="row"><div><label class="f" for="fQty">Cantidad</label><input id="fQty" class="in-f" type="number" inputmode="decimal" min="0" step="any" value="${d.qty}"></div>
    <div><label class="f" for="fUnit">Unidad</label><select id="fUnit" class="in-f">${UNITS.map(u=>`<option ${u===d.unit?"selected":""}>${u}</option>`).join("")}</select></div></div>
    <label class="f">Dónde está</label><div class="seg" id="fLoc">${state.locs.map(l=>`<button type="button" data-v="${l.k}" aria-pressed="${d.loc===l.k}">${esc(l.n)}</button>`).join("")}</div>
    <label class="f" for="fCat">Categoría</label><select id="fCat" class="in-f">${state.cats.map(c=>`<option value="${esc(c.n)}" ${c.n===d.cat?"selected":""}>${c.e} ${esc(c.n)}</option>`).join("")}</select>
    <label class="f" for="fBought">Comprado el</label><input id="fBought" class="in-f" type="date" value="${d.bought}">
    <label class="f" for="fExp">Fecha de vencimiento del envase (si la trae)</label><input id="fExp" class="in-f" type="date" value="${d.exp||""}">
    <div class="hint" id="fHint"></div>
    <label class="f" for="fPrice">Precio pagado (opcional)</label>
    <input id="fPrice" class="in-f" type="number" inputmode="numeric" min="0" step="1" value="${d.price||""}" placeholder="$">
    <div class="hint" id="fPriceHint"></div>
    <label class="check"><input type="checkbox" id="fOpen" ${d.opened?"checked":""}> Ya está abierto</label>
    <label class="f" for="fLow">Avisarme cuando queden</label>
    <div class="row"><input id="fLow" class="in-f" type="number" inputmode="decimal" min="0" step="any" value="${d.low||""}" placeholder="Sin aviso"><span id="fLowU" style="align-self:center;flex:0 0 auto;color:var(--muted)">${esc(d.unit)} o menos</span></div>
    <div class="actions"><button class="btn primary block" id="fSave">${edit?"Guardar cambios":"Agregar a la despensa"}</button>
    ${edit?`<button class="btn danger block" id="fDel">Eliminar producto</button>`:""}</div>`,o=>{
    let loc=d.loc, touchedLoc=edit, touchedCat=edit;
    const setEmoji=()=>{const f=lookup($("#fName").value);$("#fEmoji").textContent=(f&&!touchedCat)?f[1]:catEmoji($("#fCat").value)};
    const upd=()=>{
      const name=$("#fName").value, e=estimate(name,loc,$("#fOpen").checked), h=$("#fHint");
      if($("#fExp").value) h.innerHTML=`Se usará la fecha del envase: <b>${fmtDate($("#fExp").value)}</b>.`;
      else if(!name.trim()) h.textContent="Si el envase trae fecha de vencimiento, ingrésala. Si no, estimo la duración según el producto.";
      else if(e&&!e.none) h.innerHTML=`Sin fecha del envase, dura aprox. <b>${plural(e.days,"día")}</b> ${esc(locIn(loc))}: hasta el ${fmtDate(addDays($("#fBought").value||today(),e.days))}.`;
      else if(e&&e.none) h.textContent=`No tengo referencia de "${e.f[0]}" ${locIn(loc)}. Agrega la fecha del envase.`;
      else h.textContent="No tengo referencia para este producto. Agrega la fecha del envase para recibir avisos.";
      $("#fLowU").textContent=$("#fUnit").value+" o menos";
      const lp=lastPrice(name), ph=$("#fPriceHint"), cur=parseFloat($("#fPrice").value);
      if(lp&&cur>0&&(!edit||cur!==it.price)){const dp=Math.round((cur-lp.price)/lp.price*100);ph.innerHTML=dp===0?`Mismo precio que la última vez (${fmtDate(lp.date)}).`:`La última vez pagaste <b>${clp(lp.price)}</b> (${fmtDate(lp.date)}): ahora ${dp>0?`<b class="st-expired">${dp}% más caro</b>`:`<b style="color:var(--amber)">${-dp}% más barato</b>`}.`}
      else if(lp) ph.innerHTML=`La última vez pagaste <b>${clp(lp.price)}</b> (${fmtDate(lp.date)}).`;
      else ph.textContent="Se guarda para comparar en tu próxima compra.";
    };
    const setLoc=v=>{loc=v;o.querySelectorAll("#fLoc button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));upd()};
    o.querySelectorAll("#fLoc button").forEach(b=>b.onclick=()=>{touchedLoc=true;setLoc(b.dataset.v)});
    $("#fCat").onchange=()=>{touchedCat=true;setEmoji()};
    $("#fName").oninput=()=>{const f=lookup($("#fName").value);if(f){if(!touchedCat&&state.cats.some(c=>c.n===f[2]))$("#fCat").value=f[2];if(!touchedLoc){const base=Object.keys(f[3])[0];setLoc((state.locs.find(l=>l.k===base)||state.locs[0]).k)}}setEmoji();upd()};
    ["#fExp","#fBought","#fOpen","#fUnit"].forEach(s=>$(s).onchange=upd);$("#fPrice").oninput=upd;
    upd();
    if(!edit&&!d.name) setTimeout(()=>$("#fName").focus(),250);
    $("#fSave").onclick=()=>{
      const name=$("#fName").value.trim(); if(!name){$("#fName").focus();return}
      const f=lookup(name), opened=$("#fOpen").checked, e=estimate(name,loc,opened);
      const rec={id:it?.id||uid(),name:cap(name),emoji:$("#fEmoji").textContent.trim()||catEmoji($("#fCat").value),cat:$("#fCat").value,loc,
        qty:Math.max(0,parseFloat($("#fQty").value)||0),unit:$("#fUnit").value,bought:$("#fBought").value||today(),exp:$("#fExp").value||null,
        estDays:e&&!e.none?e.days:null,opened,low:parseFloat($("#fLow").value)||0,price:parseFloat($("#fPrice").value)||0};
      const lp=lastPrice(rec.name);
      if(rec.price>0&&(!it||rec.price!==it.price)) recordPrice(rec.name,rec.price,rec.qty,rec.unit);
      if(it) state.items[state.items.findIndex(x=>x.id===it.id)]=rec; else state.items.push(rec);
      if(prefill?._shopId) state.shop=state.shop.filter(s=>s.id!==prefill._shopId);
      save();closeSheet();if(!it){ui.tab="despensa"};render();toast(rec.price>0&&lp&&lp.price!==rec.price?`${rec.name}: ${clp(rec.price)}, antes ${clp(lp.price)} (${rec.price>lp.price?"+":""}${Math.round((rec.price-lp.price)/lp.price*100)}%)`:it?"Cambios guardados":`${rec.name} agregado`);
    };
    if(edit) $("#fDel").onclick=()=>askConfirm(`¿Eliminar ${it.name} de la despensa?`,()=>{state.items=state.items.filter(x=>x.id!==it.id);save();render();toast("Producto eliminado")},"Eliminar");
  });
}

function detailSheet(id){
  const it=state.items.find(x=>x.id===id); if(!it) return;
  const i=info(it), step=STEP[it.unit]||1;
  const src=it.exp?"Fecha del envase.":(it.estDays!=null?`Estimado: ${plural(it.estDays,"día")} ${locIn(it.loc)}${it.opened?", abierto":""}.`:"Sin fecha. Edítalo y agrega la del envase para recibir avisos.");
  openSheet(`<h2><span style="font-style:normal;margin-right:6px">${it.emoji||catEmoji(it.cat)}</span>${esc(it.name)}</h2>
    <div class="sub">${esc(it.cat)} ${esc(locIn(it.loc))}${it.opened?", abierto":""}</div>
    <div class="stats"><div><small>En casa</small><strong>${plural(i.inHome,"día")}</strong></div>
    <div><small>${i.left!=null&&i.left<0?"Venció":"Vence"}</small><strong class="${i.st!=="ok"?"st-"+i.st:""}">${i.exp?fmtDate(i.exp):"Sin fecha"}</strong></div>
    <div><small>Cantidad</small><strong id="dQty">${fmtQty(it.qty)} ${esc(it.unit)}</strong></div></div>
    <p class="hint" style="margin-top:0">${i.exp?`<b class="${i.st!=="ok"?"st-"+i.st:""}">${i.label}.</b> `:""}${src}${it.price?` Pagaste <b>${clp(it.price)}</b>.`:""}</p>
    <label class="f">Actualizar cantidad</label>
    <div class="stepper"><button data-d="-1" aria-label="Menos">−</button><span id="dQty2">${fmtQty(it.qty)} ${esc(it.unit)}</span><button data-d="1" aria-label="Más">+</button></div>
    <div class="actions">
      <button class="btn lime block" id="dCook">✨ Recetas con ${esc(it.name.toLowerCase())}</button>
      <div class="grid2"><button class="btn" id="dShop">A compras</button><button class="btn" id="dEdit">Editar</button></div>
      <button class="btn danger block" id="dDone">Me lo terminé</button></div>`,o=>{
    o.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{
      it.qty=Math.max(0,Math.round((it.qty+step*+b.dataset.d)*100)/100);
      const t=`${fmtQty(it.qty)} ${it.unit}`;$("#dQty").textContent=t;$("#dQty2").textContent=t;save();render();
    });
    $("#dEdit").onclick=()=>formSheet(it);
    $("#dShop").onclick=()=>{addShop(it.name);closeSheet();render();toast(`${it.name} en la lista de compras`)};
    $("#dCook").onclick=()=>{closeSheet();ui.tab="recetas";render();IN_CLAUDE?suggest(it.name):copyPrompt(it.name)};
    $("#dDone").onclick=()=>{state.items=state.items.filter(x=>x.id!==it.id);addShop(it.name);save();closeSheet();render();toast(`${it.name} terminado y agregado a compras`)};
  });
}

function locSheet(l){
  const edit=!!l; const d=l||{n:"",base:"d"};
  const isDef=edit&&DEF_LOCS.some(x=>x.k===l.k);
  openSheet(`<h2>${edit?"Editar ubicación":"Nueva ubicación"}</h2>
    <label class="f" for="lName">Nombre</label><input id="lName" class="in-f" value="${esc(d.n)}" placeholder="Ej: Cajón de verduras, Bodega">
    ${isDef?"":`<label class="f">Se comporta como</label><div class="seg" id="lBase">${DEF_LOCS.map(b=>`<button type="button" data-v="${b.k}" aria-pressed="${d.base===b.k}">${b.n}</button>`).join("")}</div><p class="hint">Sirve para estimar cuánto duran los productos ahí.</p>`}
    <div class="actions"><button class="btn primary block" id="lSave">Guardar</button></div>`,o=>{
    let base=d.base;
    o.querySelectorAll("#lBase button").forEach(b=>b.onclick=()=>{base=b.dataset.v;o.querySelectorAll("#lBase button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===base))});
    $("#lSave").onclick=()=>{const n=$("#lName").value.trim();if(!n){$("#lName").focus();return}
      if(edit){l.n=n;if(!isDef)l.base=base}else state.locs.push({k:uid(),n,base});
      save();closeSheet();render();toast("Ubicación guardada")};
    setTimeout(()=>$("#lName").focus(),250);
  });
}
function catSheet(c){
  const edit=!!c; const d=c||{n:"",e:"📦"};
  openSheet(`<h2>${edit?"Editar categoría":"Nueva categoría"}</h2>
    <label class="f" for="cName">Nombre</label>
    <div class="row"><input id="cEmoji" class="in-f emoji-in" value="${esc(d.e)}" maxlength="4" aria-label="Ícono"><input id="cName" class="in-f" value="${esc(d.n)}" placeholder="Ej: Snacks, Mascotas"></div>
    <div class="actions"><button class="btn primary block" id="cSave">Guardar</button></div>`,()=>{
    $("#cSave").onclick=()=>{const n=$("#cName").value.trim(),e=$("#cEmoji").value.trim()||"📦";if(!n){$("#cName").focus();return}
      if(state.cats.some(x=>x!==c&&norm(x.n)===norm(n))){toast("Ya existe esa categoría");return}
      if(edit){state.items.forEach(it=>{if(it.cat===c.n)it.cat=n});c.n=n;c.e=e}else state.cats.push({n,e});
      save();closeSheet();render();toast("Categoría guardada")};
    setTimeout(()=>$("#cName").focus(),250);
  });
}

function askConfirm(msg,onYes,label="Sí, continuar"){openSheet(`<h2>Confirmar</h2><p style="margin:4px 0 0;font-weight:500">${esc(msg)}</p><div class="actions"><button class="btn danger block" id="cfYes">${label}</button><button class="btn block" id="cfNo">Cancelar</button></div>`,()=>{$("#cfYes").onclick=()=>{closeSheet();onYes()};$("#cfNo").onclick=closeSheet})}
function askText(title,value,onOk){openSheet(`<h2>${esc(title)}</h2><input id="atIn" class="in-f" value="${esc(value)}" style="margin-top:8px"><div class="actions"><button class="btn primary block" id="atOk">Guardar</button></div>`,()=>{$("#atOk").onclick=()=>{const v=$("#atIn").value.trim();if(v){closeSheet();onOk(v)}};setTimeout(()=>$("#atIn").focus(),250)})}
function addShop(name){if(!state.shop.some(s=>norm(s.name)===norm(name)&&!s.done)){state.shop.push({id:uid(),name,done:false});save()}}

let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

/* ---------- recetas ---------- */
function buildPrompt(focus){
  const avail=state.items.filter(it=>info(it).st!=="expired");
  const soon=avail.filter(it=>info(it).st==="soon").map(it=>it.name);
  const list=avail.map(it=>`- ${it.name}: ${fmtQty(it.qty)} ${it.unit}${info(it).left!=null?` (vence en ${info(it).left} días)`:""}`).join("\n");
  return {avail,text:`Eres un cocinero casero en Chile. Sugiere 4 recetas simples y realistas usando principalmente los ingredientes que tengo en casa.
Mis ingredientes:
${list}
${focus?`Todas las recetas deben usar: ${focus}.`:""}
${soon.length?`Prioriza usar lo que vence pronto: ${soon.join(", ")}.`:""}
Mis preferencias: ${state.prefs||"ninguna"}.
Asume que siempre hay sal, pimienta, aceite y agua (no los listes).`};
}
async function suggest(focus){
  const {avail,text}=buildPrompt(focus);
  if(!avail.length) return;
  ui.loading=true;ui.err="";render();
  try{
    const sample=IN_CLAUDE?await claude.use("sample"):null;
    if(!sample) throw {code:"unavailable"};
    const prompt=text+`
Los nombres en "usa" deben ser exactamente como aparecen en mi lista. "faltan" son ingredientes que no tengo (máximo 3 por receta, idealmente ninguno).
Escribe en español de Chile, pasos breves (4 a 7).
Responde SOLO con JSON válido, sin texto extra, con esta forma:
{"recetas":[{"titulo":"","por_que":"una frase corta de por qué la sugieres","minutos":30,"usa":[""],"faltan":[""],"pasos":[""]}]}`;
    const out=await sample.json(prompt,{modelTier:"quick",cache:false});
    const rs=Array.isArray(out?.recetas)?out.recetas:[];
    if(!rs.length) throw {code:"empty"};
    state.recipes=rs.slice(0,5);save();
  }catch(e){
    const c=e&&e.code;
    ui.err=c==="not_granted"?"Necesitas permitir que la app consulte a Claude para generar recetas. Vuelve a tocar el botón y acepta el permiso."
      :c==="rate_limited"?"Hay muchas consultas seguidas. Espera un minuto y vuelve a intentarlo."
      :c==="unavailable"?"Las recetas automáticas funcionan al abrir la app dentro de Claude."
      :"La respuesta no llegó completa. Vuelve a intentarlo.";
  }
  ui.loading=false;render();
}
async function copyPrompt(focus){
  const {avail,text}=buildPrompt(focus); if(!avail.length) return;
  const msg=text+"\nDime qué ingredientes de mi lista usa cada receta, qué me faltaría, y los pasos breves.";
  let copied=false; try{await navigator.clipboard.writeText(msg);copied=true}catch(e){}
  openSheet(`<h2>Pedir recetas</h2><p class="hint">${copied?"Mensaje copiado. Pégalo en Claude (o en el asistente que uses) y te sugerirá recetas con lo que tienes.":"Copia este mensaje y pégalo en Claude (o en el asistente que uses)."}</p>
    <textarea class="in-f" id="pTxt" style="min-height:140px;font-size:13px" readonly>${esc(msg)}</textarea>
    <div class="actions"><button class="btn primary block" id="pCopy">${copied?"Copiado ✓":"Copiar mensaje"}</button>
    <a class="btn lime block" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://claude.ai/new?q=${encodeURIComponent(msg)}">Abrir en Claude</a></div>`,()=>{
    $("#pCopy").onclick=async()=>{try{await navigator.clipboard.writeText(msg)}catch(e){$("#pTxt").select();document.execCommand&&document.execCommand("copy")}const b=$("#pCopy");if(b)b.textContent="Copiado ✓"};
  });
}

/* ---------- exportar / importar ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mi-despensa-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Copia descargada");
}

/* ---------- eventos ---------- */
function bindView(){
  const q=$("#q"); if(q){q.oninput=()=>{ui.q=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  const p=$("#prefs"); if(p) p.onchange=()=>{state.prefs=p.value.trim();save()};
  const w=$("#warn"); if(w) w.onchange=()=>{state.warn=+w.value;save();toast("Ajuste guardado")};
  const si=$("#shopIn"); if(si) si.onkeydown=e=>{if(e.key==="Enter")doAddShop()};
  const f=$("#impFile"); if(f) f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;askConfirm("¿Reemplazar tus datos actuales por los de la copia?",()=>{state=normalize(d);save();render();toast("Copia importada")},"Reemplazar")}catch(e){toast("El archivo no es una copia válida")}};r.readAsText(file)};
}
function doAddShop(){const si=$("#shopIn");const v=si.value.trim();if(!v)return;addShop(cap(v));render();$("#shopIn").focus()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a==="filter"){ui.filter=t.dataset.v;render();if(t.classList.contains("pill-b"))window.scrollTo({top:0})}
  else if(a==="open") detailSheet(id);
  else if(a==="add") formSheet();
  else if(a==="suggest"){const p=$("#prefs");if(p){state.prefs=p.value.trim();save()}suggest()}
  else if(a==="copyPrompt"){const p=$("#prefs");if(p){state.prefs=p.value.trim();save()}copyPrompt()}
  else if(a==="missing"){const r=state.recipes[+t.dataset.i];(r?.faltan||[]).forEach(m=>addShop(cap(m)));render();toast("Agregado a compras")}
  else if(a==="addShop") doAddShop();
  else if(a==="toggle"){const s=state.shop.find(x=>x.id===id);if(s){s.done=!s.done;save();render()}}
  else if(a==="delShop"){state.shop=state.shop.filter(x=>x.id!==id);save();render()}
  else if(a==="renameShop"){const s=state.shop.find(x=>x.id===id);if(s)askText("Editar nombre",s.name,n=>{s.name=cap(n);save();render()})}
  else if(a==="suggShop"){const it=state.items.find(x=>x.id===id);if(it){addShop(it.name);render()}}
  else if(a==="clearDone"){state.shop=state.shop.filter(x=>!x.done);save();render()}
  else if(a==="toPantry"){const s=state.shop.find(x=>x.id===id);if(s){const f=lookup(s.name);formSheet(null,{name:s.name,emoji:f?f[1]:"",price:(lastPrice(s.name)||{}).price||"",cat:f&&state.cats.some(c=>c.n===f[2])?f[2]:"Otros",loc:f?(state.locs.find(l=>l.k===Object.keys(f[3])[0])||state.locs[0]).k:state.locs[0].k,_shopId:s.id})}}
  else if(a==="addLoc") locSheet();
  else if(a==="editLoc") locSheet(locOf(t.dataset.k));
  else if(a==="delLoc"){askConfirm("¿Quitar esta ubicación?",()=>{state.locs=state.locs.filter(l=>l.k!==t.dataset.k);save();render()},"Quitar")}
  else if(a==="addCat") catSheet();
  else if(a==="editCat") catSheet(state.cats.find(c=>c.n===t.dataset.n));
  else if(a==="delCat"){askConfirm("¿Quitar esta categoría?",()=>{state.cats=state.cats.filter(c=>c.n!==t.dataset.n);save();render()},"Quitar")}
  else if(a==="export") exportData();
  else if(a==="import") $("#impFile").click();
  else if(a==="wipe"){askConfirm("¿Borrar todos los productos, la lista de compras, los precios y las recetas guardadas?",()=>{const p=state.prefs,w=state.warn,cs=state.cats,ls=state.locs;state=fresh();Object.assign(state,{prefs:p,warn:w,cats:cs,locs:ls});save();render();toast("Datos borrados")},"Borrar todo")}
});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;window.scrollTo(0,0);render()});
$("#fab").onclick=()=>formSheet();

render();
initRemote();
</script>
</body>
</html>
